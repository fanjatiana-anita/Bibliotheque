FONCTIONNALITÉS PRINCIPALES DU SYSTÈME DE GESTION DE BIBLIOTHÈQUE

1. GESTION DES LIVRES
   - Ajout de nouveaux livres
   - Modification des informations des livres
   - Suppression de livres
   - Restrictions d'accès par type de membre

2. GESTION DES EXEMPLAIRES
   - Ajout de plusieurs exemplaires par livre
   - Suivi de l'état des exemplaires :
     * Disponible
     * Emprunté
     * Réservé
   - Historique des mouvements

3. GESTION DES MEMBRES
   - Types de membres (parametrable):
     * Étudiants
     * Professionnels
     * Professeurs
   - Restrictions selon l'âge ou le profil
   - Gestion des informations personnelles

4. INSCRIPTIONS ET COTISATIONS
   - Paiement des frais d'inscription
   - Renouvellement des abonnements
   - Historique des paiements
   - Génération de reçus

5. SYSTÈME DE PRÊT
   - Prêt à domicile avec date de retour ou Consultation sur place
   - Calcul automatique des dates de retour(parametrable)
   - Limites d'emprunt par membre

6. RÉSERVATIONS
   - Réservation d'exemplaires indisponibles
   - File d'attente pour les réservations
   - Notification de disponibilité
   - Annulation de réservation

7. GESTION DES RETARDS
   - Calcul des pénalités
   - Penalisation variables selon le type de membre
   - Historique des pénalités

8. PROLONGATION DE PRÊT
   - Demande de prolongation
   - Validation par l'administration
   - Vérification des conflits(c’est a dire une verification si aucun autre adherent l’ a reserve (valide par l’administration) avant que la personne actuelle qui le prete ne demande une prolongation. 
   - Notification de décision

9. GESTION DES JOURS FÉRIÉS
   - Configuration des jours chômés
   - Ajustement automatique des dates
   - Règles paramétrables
(par exemple, si la date de retour tombe exactement a un jour ferie, selon notre parametre, la date de retour doit etre change de n jours (avant ou apres) la date de retour prevu).

10. ESPACE ADMINISTRATEUR
    - Tableau de bord complet
    - Validation des demandes
    - Gestion des utilisateurs
    - Statistiques et rapports

11. ESPACE MEMBRE
    - Consultation des emprunts
    - Historique des prêts
    - Demandes en ligne
    - Gestion du profil

12. NOTIFICATIONS
    - Alertes par email/SMS
    - Rappels de retour
    - Avis de pénalité
- Confirmations

