Voici la regle metier :
Un adherent ne peut pas reserver et preter un livre si:
   il est en penalite
   il n'a pas encore retourne un exemplaire prete a un et doit etre reourner a une date anterieur a la date de retour prevue

   Une livre ne peut etre accessible que pour les membres ayant un age >= a l'age minimum requis 



Lors du pret d'un exemplaire (directement sur place(a la bibliotheque))

fonctionnement du penalisation:
on dit qu'un membre est penalise s'il n'a pas encore retourner un exemplaire a sa date de retour (si la date est anterieur a la date actuelle)
A partir du moment ou la date de retour devient une date anterieur [ar rapport a la date actuelle, une alerte apparait sur l'utilisateur pour leui informer que 
la date de retour est depasse.
Ici la penalisation consiste a l'interdiction a un membre le fait de preter ou meme reserver un livre a une duree particuliere en fonction de sa profil
Cette duree de penalite ne debute qu'au moment ou il rendra le livre (donc a partir du moment  ou la date de retour d'un exemplaire par rapport a un pret
Cela signifie que a partir du moment ou la date de retour d'un pret est depasse, l'utilisateur ne peut pas ni preter ni reserver un exemplaire la duree de cela 
depend du moment ou il rendra l'exemplaire en retard et c'est a partir de ce moment ou date de rendu d'exemplaire c'est a partir de la que l'on compte la date de debut de penalisation pendant une certaine duree
) Il faut noter que la duree de penalite pour un meme membre donne pourrais augmente au fur et a mesure s'il a encore d'autre exemplaire qu'il n'a pas encore rendu a la date de retour prevu , donc s'il est penalise jusque le 10 eme du mois par exemple 
alors qu'il a egelement ete en retard sur le retour d'un exemplaire 2 cas peut arriver:
-si il a retourner l'autre livre en retard avant la date de fin de sa 1ere penalite: alors la duree de sa penalite augementera a partir de sa date de fin de 1ere penalite + duree normale de la nouvelle penalisation
si la date de fin de penalite est atteind alors qu'iln'a pas encore retourner le second exemplaire en retard alors il ne peut pas enore ni reserve ni preter un livre
Donc ca signifie que la date debut et fin de penalite ne compte qu'a partir de la date ou il rend l'exemplaire retarde, mais durant tous ce temps la , il ne pourra faire aucune action donc le retour du livre est comme un limiteur de penalite car avant cela il est deja penalise mais a une duree infini

Un utilisateur pourrait resrver un exemplaire a l'avance
   Il faut noter que pour chaque membre il y aurai un nombre de quotaMax par pret,par reservation et par prolongement)

